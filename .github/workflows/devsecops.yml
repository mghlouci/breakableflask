name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Dependances
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /src/requirements.txt
            
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction de l'image
        run: |
          docker build -t breakableflask:ci .

      - name: Test Dockerfile
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            breakableflask:ci
            
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
